schema_version = "1.4"

[metadata]
name = "fulfillment-cell-bench"

[verifier]
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"

[[environment.mcp_servers]]
name = "cell"
transport = "stdio"
command = "python"
args = ["-m", "robotization_bench.mcp_server", "--submission", "/logs/artifacts/submission.json", "--log", "/logs/agent/cell-episode.json"]

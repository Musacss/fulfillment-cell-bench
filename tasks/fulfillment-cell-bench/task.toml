schema_version = "1.4"

[metadata]
name = "fulfillment-cell-bench"

[agent]
timeout_sec = 600.0

[verifier]
timeout_sec = 180.0
environment_mode = "separate"

[verifier.environment]
network_mode = "no-network"

[environment]
build_timeout_sec = 600.0
cpus = 2
memory_mb = 4096

[[environment.mcp_servers]]
name = "cell"
transport = "stdio"
command = "python3"
args = ["/app/src/robotization_bench/mcp_proxy.py", "--socket", "/run/bench/bench.sock"]

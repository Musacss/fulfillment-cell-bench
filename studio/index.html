<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simulation</title>
</head>
<body>
  <div id="app-shell" class="app-shell">
    <header class="topbar">
      <div class="topbar-row">
        <div class="ctrl-group">
          <div class="seg-switch" role="group" aria-label="View mode">
            <button id="btn-mode-single" type="button">SINGLE</button>
            <button id="btn-mode-compare" type="button" class="active">COMPARE A/B</button>
          </div>

          <div class="field-inline">
            <span class="field-lbl">PACK</span>
            <select id="sel-source" title="Data source">
              <option value="./3d-pack/index.json">3D PACK</option>
              <option value="http://127.0.0.1:8765/index.json">BRIDGE :8765</option>
              <option value="http://127.0.0.1:8841/index.json">BRIDGE :8841</option>
              <option value="custom">URL...</option>
            </select>
          </div>

          <div class="field-inline">
            <span class="field-lbl">SEED</span>
            <select id="sel-seed" title="Order stream seed"></select>
          </div>

          <div id="single-selectors" class="ctrl-group" hidden>
            <div class="field-inline">
              <span class="field-lbl">RUN</span>
              <select id="sel-run" title="Run"></select>
            </div>
          </div>

          <div id="compare-selectors" class="ctrl-group">
            <div class="field-inline">
              <span class="field-lbl">PAIR</span>
              <select id="sel-comparison" title="Comparison pair"></select>
            </div>
            <div class="field-inline">
              <span class="field-lbl">A</span>
              <select id="sel-run-a" title="Run A"></select>
            </div>
            <div class="field-inline">
              <span class="field-lbl">B</span>
              <select id="sel-run-b" title="Run B"></select>
            </div>
          </div>
        </div>

        <div class="ctrl-group right-tools">
          <div class="seg-switch" role="group" aria-label="Camera">
            <button type="button" data-cam="blueprint" title="Top plan view">PLAN</button>
            <button type="button" data-cam="q1" title="Inbound and picking">PREP</button>
            <button type="button" data-cam="robot" title="Packing and robot cell">ROBOT</button>
            <button type="button" data-cam="qc" title="Quality control">QC</button>
            <button type="button" data-cam="rework" title="Rework and scrap stations">REWORK</button>
            <button type="button" data-cam="break" title="Break area">BREAK</button>
          </div>

          <button id="btn-local-files" type="button" class="cad-btn" title="Open files">FILES</button>
          <button id="btn-local-folder" type="button" class="cad-btn" title="Open folder">FOLDER</button>
          <input id="file-local" type="file" multiple accept=".json,.jsonl,.ndjson" style="display:none;" />
          <input id="folder-local" type="file" webkitdirectory multiple style="display:none;" />
          <button id="toggle-right" type="button" class="cad-btn active" title="Toggle data panel">PANEL</button>
        </div>
      </div>
    </header>

    <main id="workspace" class="workspace">
      <section class="canvas-pane">
        <div id="scene-grid" class="scene-grid comparison">
          <section id="panel-left" class="scene-panel active-panel" aria-label="Scene A">
            <div class="scene-head">
              <div class="scene-head-left">
                <span id="scene-label-left" class="scene-title-code">A</span>
                <span id="scene-plan-left" class="scene-plan-meta">—</span>
              </div>
              <div id="scene-badges-left" class="scene-badges"></div>
            </div>
            <div class="canvas-wrap">
              <canvas id="canvas-left" tabindex="0" aria-label="Scene A"></canvas>
              <div id="loading-left" class="scene-loading">LOADING...</div>
            </div>
          </section>

          <section id="panel-right" class="scene-panel" aria-label="Scene B">
            <div class="scene-head">
              <div class="scene-head-left">
                <span id="scene-label-right" class="scene-title-code">B</span>
                <span id="scene-plan-right" class="scene-plan-meta">—</span>
              </div>
              <div id="scene-badges-right" class="scene-badges"></div>
            </div>
            <div class="canvas-wrap">
              <canvas id="canvas-right" tabindex="0" aria-label="Scene B"></canvas>
              <div id="loading-right" class="scene-loading">LOADING...</div>
            </div>
          </section>
        </div>

        <div id="status-toast" class="status-toast" style="display:none;"></div>
      </section>

      <aside id="ledger-panel" class="ledger-panel">
        <div class="inspector-run-bar">
          <div id="inspector-switch" class="seg-switch">
            <button type="button" data-inspector="0" class="active">A</button>
            <button type="button" data-inspector="1">B</button>
          </div>
          <span id="inspector-meta" class="inspector-meta">TICK 0</span>
        </div>

        <nav class="ledger-tabs" role="tablist">
          <button type="button" class="tab-btn active" data-tab="flow">FLOW</button>
          <button type="button" class="tab-btn" data-tab="scene">SCENE</button>
          <button type="button" class="tab-btn" data-tab="econ">COSTS</button>
          <button type="button" class="tab-btn" data-tab="events">EVENTS <span id="ev-count" class="tab-count">0</span></button>
        </nav>

        <div class="ledger-body">
          <section id="tab-flow" class="tab-pane active">
            <div class="spec-block">
              <div class="spec-head">
                <span>METRICS</span>
              </div>
              <div id="live-metrics-box"></div>
            </div>

            <div class="spec-block">
              <div class="spec-head">
                <span>QUEUES</span>
              </div>
              <div id="live-queues-box"></div>
            </div>

            <div class="spec-block">
              <div class="spec-head">
                <span>RESOURCES</span>
              </div>
              <div id="live-resources-box"></div>
            </div>
          </section>

          <section id="tab-scene" class="tab-pane">
            <div class="spec-block">
              <div class="spec-head spec-head-row">
                <span>INSPECTOR</span>
                <button id="btn-clear-sel" type="button" class="mini-link-btn">CLEAR</button>
              </div>
              <div class="order-pick-row">
                <select id="sel-order-pick" title="Select order"></select>
              </div>
              <div id="entity-inspector-box"></div>
            </div>

            <div class="spec-block">
              <div class="spec-head spec-head-row">
                <span>LAYERS</span>
                <span id="layer-count-lbl">5 / 5</span>
              </div>
              <div id="scene-layers-box" class="layers-checklist"></div>
            </div>

            <div class="spec-block">
              <div class="spec-head">
                <span>STAGES</span>
              </div>
              <div id="workshop-chain-box"></div>
            </div>

            <div class="spec-block">
              <div class="spec-head">
                <span>SCENE</span>
              </div>
              <div id="scene-stats-box"></div>
            </div>
          </section>

          <section id="tab-econ" class="tab-pane">
            <div class="spec-block">
              <div class="spec-head">
                <span>EVALUATION</span>
              </div>
              <div id="eval-summary-box"></div>
            </div>

            <div id="quarter-summary-block" class="spec-block" hidden>
              <div class="spec-head">
                <span>QUARTER</span>
              </div>
              <div id="quarter-summary-box"></div>
            </div>

            <div class="spec-block">
              <div class="spec-head">
                <span>BREAKDOWN</span>
              </div>
              <div id="econ-breakdown-box"></div>
            </div>
          </section>

          <section id="tab-events" class="tab-pane">
            <div class="spec-block">
              <div class="spec-head spec-head-row">
                <span>EVENTS</span>
                <select id="sel-tab-ev-filter" class="compact-select" title="Filter">
                  <option value="all">ALL</option>
                  <option value="jam">JAM</option>
                  <option value="assist">ASSIST</option>
                  <option value="rework">REWORK</option>
                  <option value="break">BREAK</option>
                  <option value="escaped">DEFECT</option>
                  <option value="scrap">SCRAP</option>
                </select>
              </div>
              <div id="events-list-box"></div>
            </div>

            <div id="diag-block" class="spec-block" hidden>
              <div class="spec-head">
                <span>ISSUES</span>
              </div>
              <div id="mistakes-box"></div>
            </div>
          </section>
        </div>
      </aside>
    </main>

    <footer class="bottom-bar">
      <div class="quarter-row">
        <div id="week-strip" class="week-strip"></div>
        <div id="highlight-chips" class="highlight-strip" hidden></div>
      </div>

      <div class="transport-row">
        <div class="transport-btns">
          <button id="btn-reset" type="button" class="cad-btn" title="Reset">|◀</button>
          <button id="btn-step-back" type="button" class="cad-btn" title="Step back">-1</button>
          <button id="btn-play" type="button" class="cad-btn play-btn" title="Play / Pause">PLAY</button>
          <button id="btn-step-fwd" type="button" class="cad-btn" title="Step forward">+1</button>
        </div>

        <select id="sel-speed" title="Playback speed">
          <option value="5">5×</option>
          <option value="15" selected>15×</option>
          <option value="30">30×</option>
          <option value="60">60×</option>
          <option value="150">150×</option>
          <option value="300">300×</option>
        </select>

        <div class="scrubber-wrap">
          <div id="scrubber-markers" class="scrubber-markers"></div>
          <input id="tick-scrubber" type="range" min="0" max="1080" step="0.05" value="0" />
          <div id="ot-marker" class="ot-marker" title="8h shift boundary (T=960)">T960</div>
        </div>

        <div class="event-jump-group">
          <select id="sel-event-filter" title="Event type">
            <option value="all">ALL</option>
            <option value="jam">JAM</option>
            <option value="assist">ASSIST</option>
            <option value="rework">REWORK</option>
            <option value="break">BREAK</option>
            <option value="escaped">DEFECT</option>
            <option value="scrap">SCRAP</option>
          </select>
          <button id="btn-next-event" type="button" class="cad-btn" title="Next event">NEXT →</button>
        </div>

        <div id="clock-readout" class="clock-readout">TICK 0000 / 1080 · 00:00:00</div>
      </div>
    </footer>
  </div>

  <script type="module" src="/src/app.js"></script>
</body>
</html>
